                    lidarPointsSystem.material.uniforms.uGazeActive.value = 1.0;
                }
            } else {
                reticleEl.classList.remove('focused');
                captionEl.classList.remove('visible');
                if (lidarPointsSystem) lidarPointsSystem.material.uniforms.uGazeActive.value = 0.0;
            }

            for (const vk of ACTIVE_VOICE_KEYS) {
                const lvl = voiceLevels[vk] || 0;
                const meshes = voiceMeshesMap[vk];
                if (meshes && meshes.length > 0 && meshes[0].material) {
                    meshes[0].material.emissiveIntensity = 0.02 + lvl * 0.35;
                }
                const barEl = document.getElementById(`bar-${vk}`);
                if (barEl) {
                    barEl.style.width = `${Math.round(lvl * 100)}%`;
                }
            }
        }

        // ============================================================================
        // 8. UI CONTROLS
        // ============================================================================
        function setInteractionMode(mode) {
            interactionMode = mode;
            document.getElementById('btn-mode-auto').classList.toggle('active', mode === 'AUTONOMOUS');
            document.getElementById('btn-mode-act').classList.toggle('active', mode === 'ACTIVE');
            document.getElementById('seq-mode-label').innerText =
                mode === 'ACTIVE' ? 'ACTIVE LOOP RECORDER (CLICK 3D OR STEPS)' : '16-STEP SEQUENCER';
        }

        function toggleGuidedRoute(forceState) {
            autoRouteActive = typeof forceState === 'boolean' ? forceState : !autoRouteActive;
            document.getElementById('btn-route').classList.toggle('active', autoRouteActive);
        }

        function cycleVisualStyle() {
            const styles = ['LIDAR', 'HYBRID', 'ARCHITECTURAL'];
            visualStyle = styles[(styles.indexOf(visualStyle) + 1) % styles.length];
            const btn = document.getElementById('btn-view');

            if (visualStyle === 'LIDAR') {
                btn.innerText = "View: LiDAR [V]";
                allShadedMeshes.forEach(m => m.visible = false);
                allWireLines.forEach(l => l.visible = false);
                darkCoreMeshes.forEach(d => d.visible = true);
                if (lidarPointsSystem) lidarPointsSystem.visible = true;
            } else if (visualStyle === 'HYBRID') {
                btn.innerText = "View: Hybrid [V]";
                allShadedMeshes.forEach(m => m.visible = true);
                allWireLines.forEach(l => l.visible = true);
                darkCoreMeshes.forEach(d => d.visible = false);
                if (lidarPointsSystem) lidarPointsSystem.visible = true;
            } else {
                btn.innerText = "View: Shaded [V]";
                allShadedMeshes.forEach(m => m.visible = true);
                allWireLines.forEach(l => l.visible = true);
                darkCoreMeshes.forEach(d => d.visible = false);
                if (lidarPointsSystem) lidarPointsSystem.visible = false;
            }
        }

        function teleportToWaypoint(idx) {
            const wp = WAYPOINTS[idx];
            if (!wp) return;
            toggleGuidedRoute(false);
            playerFootPos.set(wp.pos.x, wp.pos.y, wp.pos.z);
            lookCameraAt(wp.lookAt.x, wp.lookAt.y, wp.lookAt.z);
        }

        function startExperience(withAutoRoute) {
            initAudioEngine();
            const overlay = document.getElementById('overlay');
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
                document.getElementById('hud').style.opacity = '1';
                isRunning = true;
                if (withAutoRoute) {
                    autoRouteTime = 0;
                    toggleGuidedRoute(true);
                } else {
                    container.requestPointerLock();
                }
            }, 400);
        }

        document.getElementById('btn-start-free').addEventListener('click', () => startExperience(false));
        document.getElementById('btn-start-guided').addEventListener('click', () => startExperience(true));

        document.addEventListener('pointerlockchange', () => {
            isPointerLocked = (document.pointerLockElement === container);
            if (isPointerLocked) mouseNDC.set(0, 0);
        });

        document.addEventListener('mousemove', (e) => {
            if (!isRunning) return;
            if (isPointerLocked && !autoRouteActive) {
                cameraYaw -= e.movementX * 0.0020;
                cameraPitch -= e.movementY * 0.0020;
                cameraPitch = Math.max(-Math.PI / 2.15, Math.min(Math.PI / 2.15, cameraPitch));
                camera.rotation.y = cameraYaw;
                camera.rotation.x = cameraPitch;
            } else if (!isPointerLocked) {
                mouseNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouseNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
            }
        });

        // Clicking in the 3D scene triggers the gazed element's voice, spawns a 3D ripple,
        // selects that voice in the bottom bar, and records it into the current step in User Activates mode!
        container.addEventListener('mousedown', (e) => {
            if (!isRunning || e.button !== 0) return;
            initAudioEngine();
            if (!isPointerLocked && !autoRouteActive) {
                container.requestPointerLock();
            }
            if (currentGazeHit && currentGazeHit.voice) {
                const v = currentGazeHit.voice;
                const cfg = VOICE_CONFIG[v] || VOICE_CONFIG.CONTEXT_MASS;
                if (ACTIVE_VOICE_KEYS.includes(v)) {
                    selectVoicePad(v);
                } else {
                    triggerVoiceStep(v, currentStep, 0.90);
                }
                spawnRipple(currentGazeHit.point, cfg.colorHex);

                if (interactionMode === 'ACTIVE') {
                    sequencerSteps[currentStep].push({
                        voice: v,
                        point: currentGazeHit.point.clone()
                    });
                    refreshSequencerStepUI(currentStep);
                }
            }
        });

        document.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'w' || e.key === 'ArrowUp') { moveKeys.w = true; if (autoRouteActive) toggleGuidedRoute(false); }
            if (k === 's' || e.key === 'ArrowDown') { moveKeys.s = true; if (autoRouteActive) toggleGuidedRoute(false); }
            if (k === 'a' || e.key === 'ArrowLeft') { moveKeys.a = true; if (autoRouteActive) toggleGuidedRoute(false); }
            if (k === 'd' || e.key === 'ArrowRight') { moveKeys.d = true; if (autoRouteActive) toggleGuidedRoute(false); }

            if (k === 'm') setInteractionMode(interactionMode === 'AUTONOMOUS' ? 'ACTIVE' : 'AUTONOMOUS');
            if (k === 'p' || e.code === 'Space') {
                e.preventDefault();
                toggleAudioMute();
            }
            if (k === 'r') toggleGuidedRoute();
            if (k === 'v') cycleVisualStyle();
            if (k === 'c') clearSequencerLoop();
            if (['1', '2', '3', '4', '5', '6'].includes(k)) teleportToWaypoint(parseInt(k, 10) - 1);
        });

        document.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'w' || e.key === 'ArrowUp') moveKeys.w = false;
            if (k === 's' || e.key === 'ArrowDown') moveKeys.s = false;
            if (k === 'a' || e.key === 'ArrowLeft') moveKeys.a = false;
            if (k === 'd' || e.key === 'ArrowRight') moveKeys.d = false;
        });

        // ============================================================================
        // 9. ANIMATION LOOP
        // ============================================================================
        const clock = new THREE.Clock();

        function updateAutoRoute(dt) {
            // Scale auto-walk progression speed proportionally to the user's speed slider!
            const speedRatio = walkSpeed / 2.4;
            const totalDuration = AUTO_ROUTE_KEYFRAMES[AUTO_ROUTE_KEYFRAMES.length - 1].t;
            autoRouteTime = (autoRouteTime + dt * speedRatio) % totalDuration;

            let k0 = AUTO_ROUTE_KEYFRAMES[0];
            let k1 = AUTO_ROUTE_KEYFRAMES[1];
            for (let i = 0; i < AUTO_ROUTE_KEYFRAMES.length - 1; i++) {
                if (autoRouteTime >= AUTO_ROUTE_KEYFRAMES[i].t && autoRouteTime <= AUTO_ROUTE_KEYFRAMES[i + 1].t) {
                    k0 = AUTO_ROUTE_KEYFRAMES[i];
                    k1 = AUTO_ROUTE_KEYFRAMES[i + 1];
                    break;
                }
            }

            const span = Math.max(0.001, k1.t - k0.t);
            const rawAlpha = (autoRouteTime - k0.t) / span;
            const alpha = rawAlpha * rawAlpha * (3 - 2 * rawAlpha);

            playerFootPos.set(
                k0.pos[0] + (k1.pos[0] - k0.pos[0]) * alpha,
                k0.pos[1] + (k1.pos[1] - k0.pos[1]) * alpha,
                k0.pos[2] + (k1.pos[2] - k0.pos[2]) * alpha
            );
            lookCameraAt(
                k0.look[0] + (k1.look[0] - k0.look[0]) * alpha,
                k0.look[1] + (k1.look[1] - k0.look[1]) * alpha,
                k0.look[2] + (k1.look[2] - k0.look[2]) * alpha
            );
            isMoving = true;
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.1);
            const elapsed = clock.getElapsedTime();

            if (isRunning) {
                if (autoRouteActive) {
                    updateAutoRoute(dt);
                } else {
                    const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraYaw);
                    const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraYaw);

                    const moveVec = new THREE.Vector3();
                    if (moveKeys.w) moveVec.add(forward);
                    if (moveKeys.s) moveVec.sub(forward);
                    if (moveKeys.d) moveVec.add(right);
                    if (moveKeys.a) moveVec.sub(right);

                    isMoving = moveVec.lengthSq() > 0.001;
                    if (isMoving) {
                        moveVec.normalize().multiplyScalar(walkSpeed * dt);
                        const candX = playerFootPos.x + moveVec.x;
                        const candZ = playerFootPos.z + moveVec.z;
                        if (!checkHorizontalCollision(candX, playerFootPos.z, playerFootPos.y)) playerFootPos.x = candX;
                        if (!checkHorizontalCollision(playerFootPos.x, candZ, playerFootPos.y)) playerFootPos.z = candZ;
                    }

                    const targetElev = getArchitecturalFloorElevation(playerFootPos.x, playerFootPos.z, playerFootPos.y);
                    playerFootPos.y += (targetElev - playerFootPos.y) * Math.min(1.0, dt * 10.0);

                    const bob = isMoving ? Math.sin(elapsed * 7.5) * 0.028 : 0.0;
                    camera.position.set(playerFootPos.x, playerFootPos.y + PLAYER_EYE_HEIGHT + bob, playerFootPos.z);
                }

                evaluateSpatialZoneAndGaze(dt);
                updateContinuousAudio(dt);
            }

            if (lidarPointsSystem && lidarPointsSystem.visible) {
                lidarPointsSystem.material.uniforms.uTime.value = elapsed;
                for (let i = activeRipples.length - 1; i >= 0; i--) {
                    activeRipples[i].radius += dt * 16.0;
                    if (activeRipples[i].radius > 28.0) activeRipples.splice(i, 1);
                }
                for (let i = 0; i < MAX_RIPPLES; i++) {
                    if (i < activeRipples.length) {
                        rippleCenters[i].copy(activeRipples[i].center);
                        rippleRadii[i] = activeRipples[i].radius;
                        rippleColors[i].copy(activeRipples[i].color);
                    } else {
                        rippleRadii[i] = -1.0;
                    }
                }
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
